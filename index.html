<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض اليوم الوطني الفني 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        * { font-family: 'Tajawal', sans-serif; }
        body { margin: 0; overflow: hidden; background-color: #fdf2f8; }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .pastel-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #fbcfe8;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tween.js for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body class="text-slate-700 antialiased selection:bg-pink-300 selection:text-white">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-screen flex flex-col justify-between p-4 md:p-6 pointer-events-none">
        
        <!-- Header -->
        <header class="flex justify-between items-center max-w-6xl mx-auto w-full pastel-panel p-4 rounded-3xl pointer-events-auto shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-400 flex items-center justify-center text-lg shadow-sm text-white font-bold">
                    🇸🇦
                </div>
                <div>
                    <h1 class="font-bold text-pink-700 text-base md:text-lg">معرض اليوم الوطني الفني</h1>
                    <p class="text-xs text-pink-500 font-medium">إعداد الطالبة: لمى الغامدي | إشراف المعلمة: أمل</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-pink-100/80 px-3 py-1.5 rounded-full border border-pink-200">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs text-pink-600 font-semibold hidden md:inline">جولة باستيل ثلاثية الأبعاد</span>
            </div>
        </header>

        <!-- Bottom Controls & Guide Dialogue Box -->
        <div class="max-w-2xl mx-auto w-full flex flex-col items-center gap-3 pointer-events-auto mb-2">
            
            <!-- Dialogue Box -->
            <div class="pastel-panel p-4 rounded-3xl w-full text-center border-2 border-pink-300 shadow-lg">
                <div class="text-xs text-pink-600 font-bold mb-1 flex items-center justify-center gap-1">
                    <span>🎀 المرشدة سارة</span>
                </div>
                <p id="guide-text" class="text-sm md:text-base font-semibold text-slate-700">
                    أهلاً بكِ في معرضنا الفني الباستيل! اضغطي على زر "بدء الجولة" لنكتشف اللوحات والجمال معاً.
                </p>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center gap-3 bg-white/90 backdrop-blur-md p-2 rounded-2xl border border-pink-200 shadow-md">
                <button id="prev-btn" onclick="prevArtwork()" class="hidden px-4 py-2 bg-pink-100 hover:bg-pink-200 text-pink-700 rounded-xl text-xs md:text-sm font-bold transition disabled:opacity-40">
                    ← اللوحة السابقة
                </button>
                
                <button id="action-btn" onclick="startTour()" class="px-6 py-2.5 bg-pink-400 hover:bg-pink-500 text-white rounded-xl text-xs md:text-sm font-extrabold shadow-md transition">
                    بدء الجولة 🌸
                </button>

                <button id="next-btn" onclick="nextArtwork()" class="hidden px-4 py-2 bg-emerald-400 hover:bg-emerald-500 text-white rounded-xl text-xs md:text-sm font-bold transition">
                    اللوحة التالية →
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Configuration
        const artworksData = [
            {
                title: "أصالة الماضي وحداثة الحاضر",
                artist: "الطالبة: سارة محمد",
                desc: "عمل فني تجسد فيه عراقة التراث السعودي ممزوجاً مع النهضة المعمارية الحديثة.",
                color: 0x93c5fd, // Soft Pastel Blue
                xPos: -8
            },
            {
                title: "طبيعة وشموخ وطن",
                artist: "الطالبة: ريم عبد الله",
                desc: "تجسيد رائع لطبيعة وتضاريس المملكة الخلابة بألوان باستيل يعلوها شموخ النخيل.",
                color: 0x6ee7b7, // Soft Pastel Emerald Green
                xPos: 0
            },
            {
                title: "رؤية مستقبلية زاهية",
                artist: "الطالبة: شهد خالد",
                desc: "رسمة تجريدية تعبر عن طموحات اليوم الوطني ورؤية 2030 الزاهرة بسواعد الشباب.",
                color: 0xfde047, // Soft Pastel Yellow
                xPos: 8
            }
        ];

        let scene, camera, renderer;
        let guideCharacter;
        let currentStep = -1;
        let synth = window.speechSynthesis;

        function init3D() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfdf2f8); // Very soft pinkish background
            scene.fog = new THREE.FogExp2(0xfdf2f8, 0.012);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.2, 14);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting (Soft & Warm Pastel Lighting)
            const ambientLight = new THREE.AmbientLight(0xfff5f5, 0.85);
            scene.add(ambientLight);

            const topLight = new THREE.DirectionalLight(0xffffff, 0.4);
            topLight.position.set(0, 10, 5);
            scene.add(topLight);

            // 5. Environment (Bright White Floor, Soft Pastel Walls)
            createGalleryRoom();

            // 6. Add Guide Avatar (Girl Guide Character)
            guideCharacter = createGuideCharacter();
            scene.add(guideCharacter);

            // 7. Add Artworks, Wires, Plants & Pastel Lights
            artworksData.forEach((art, index) => {
                createHangingArtwork(art, index);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function createGalleryRoom() {
            // Pure Soft White Marble Floor
            const floorGeo = new THREE.PlaneGeometry(50, 30);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0xf8fafc, 
                roughness: 0.1, 
                metalness: 0.05 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);

            // Soft Beige/Grey Pastel Back Wall
            const wallGeo = new THREE.PlaneGeometry(50, 12);
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0xf1f5f9, 
                roughness: 0.7 
            });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 6, -6);
            scene.add(wall);

            // Pastel Ceiling
            const ceilingGeo = new THREE.PlaneGeometry(50, 30);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xfff1f2, roughness: 0.9 });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 12;
            scene.add(ceiling);

            // Track Light Bar (Rose Gold / Pastel Pink Beam)
            const trackGeo = new THREE.BoxGeometry(40, 0.15, 0.3);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, metalness: 0.5 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.position.set(0, 11.9, -5.2);
            scene.add(track);
        }

        // 👩‍🎓 Cute Pastel Girl Guide Character
        function createGuideCharacter() {
            const guideGroup = new THREE.Group();
            guideGroup.position.set(-3, 0, 3); // Position near the view

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });
            const dressMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.4 }); // Pastel Pink Dress
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x472825, roughness: 0.6 });

            // Body / Dress (Cone Shape)
            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.65, 1.8, 16);
            const body = new THREE.Mesh(bodyGeo, dressMat);
            body.position.y = 0.9;
            guideGroup.add(body);

            // Head (Sphere)
            const headGeo = new THREE.SphereGeometry(0.4, 20, 20);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 2.1;
            guideGroup.add(head);

            // Hair (Stylized Pastel Spheres)
            const hairGeo = new THREE.SphereGeometry(0.45, 16, 16);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 2.25, -0.05);
            guideGroup.add(hair);

            // Hair Ribbon / Bow (Cute Pastel Green)
            const bowMat = new THREE.MeshStandardMaterial({ color: 0x34d399 });
            const bowGeo = new THREE.BoxGeometry(0.3, 0.15, 0.15);
            const bow = new THREE.Mesh(bowGeo, bowMat);
            bow.position.set(0, 2.6, 0.1);
            guideGroup.add(bow);

            return guideGroup;
        }

        function createHangingArtwork(art, index) {
            const group = new THREE.Group();
            group.position.x = art.xPos;

            // Artwork Panel Canvas (Clean Soft Frame)
            const panelGeo = new THREE.BoxGeometry(3.6, 4.8, 0.1);
            const panelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            panel.position.set(0, 5.2, -5.5);
            group.add(panel);

            // Inner Picture Plane (Pastel Colors)
            const picGeo = new THREE.PlaneGeometry(3.2, 3.2);
            const picMat = new THREE.MeshStandardMaterial({ color: art.color, roughness: 0.4 });
            const pic = new THREE.Mesh(picGeo, picMat);
            pic.position.set(0, 5.6, -5.44);
            group.add(pic);

            // Elegant Wires Hanging from Ceiling
            const wireMat = new THREE.MeshBasicMaterial({ color: 0xc084fc }); // Soft Lavender Wires
            
            const wireGeoLeft = new THREE.CylinderGeometry(0.015, 0.015, 4.5);
            const wireLeft = new THREE.Mesh(wireGeoLeft, wireMat);
            wireLeft.position.set(-1.6, 9.7, -5.5);
            group.add(wireLeft);

            const wireRight = new THREE.Mesh(wireGeoLeft, wireMat);
            wireRight.position.set(1.6, 9.7, -5.5);
            group.add(wireRight);

            // Soft Warm Spotlight
            const spotLight = new THREE.SpotLight(0xfff0f5, 2);
            spotLight.position.set(art.xPos, 11.5, -4);
            spotLight.target = panel;
            spotLight.angle = Math.PI / 6;
            spotLight.penumbra = 0.5;
            scene.add(spotLight);

            // 🌸 Cute Pastel Flower Pots (Pink Flowers & Light Sage Green Plants)
            const plantGroup = createPastelPlantPots();
            plantGroup.position.set(art.xPos + 4, 0, -5);
            scene.add(plantGroup);

            scene.add(group);
        }

        function createPastelPlantPots() {
            const plantGroup = new THREE.Group();

            // Pastel White/Pink Pot
            const potGeo = new THREE.CylinderGeometry(0.5, 0.35, 1.1, 16);
            const potMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.3 });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.y = 0.55;
            plantGroup.add(pot);

            // Light Sage Green Leaves
            const leafGeo = new THREE.SphereGeometry(0.65, 12, 12);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0xa7f3d0, roughness: 0.7 }); // Light Green Pastel
            const leaves = new THREE.Mesh(leafGeo, leafMat);
            leaves.position.set(0, 1.4, 0);
            plantGroup.add(leaves);

            // Cute Pink Flowers
            const flowerGeo = new THREE.SphereGeometry(0.28, 10, 10);
            const flowerMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.5 }); // Pink Flower
            
            const flower1 = new THREE.Mesh(flowerGeo, flowerMat);
            flower1.position.set(0.25, 1.7, 0.2);
            plantGroup.add(flower1);

            const flower2 = new THREE.Mesh(flowerGeo, flowerMat);
            flower2.position.set(-0.25, 1.8, -0.1);
            plantGroup.add(flower2);

            return plantGroup;
        }

        function startTour() {
            document.getElementById('action-btn').classList.add('hidden');
            document.getElementById('prev-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            goToArtwork(0);
        }

        function goToArtwork(index) {
            stopSpeech();
            currentStep = index;
            const item = artworksData[currentStep];

            // Camera movement towards artwork
            new TWEEN.Tween(camera.position)
                .to({ x: item.xPos, y: 5.2, z: 2.2 }, 1400)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            // Move Guide Girl next to the focused artwork!
            new TWEEN.Tween(guideCharacter.position)
                .to({ x: item.xPos - 3.2, y: 3.2, z: -3.5 }, 1200)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            document.getElementById('guide-text').innerHTML = `<b class="text-pink-600">${item.title}</b> — ${item.artist}<br><span class="text-xs text-slate-500">${item.desc}</span>`;
            speakText(`${item.title}. ${item.artist}. ${item.desc}`);

            document.getElementById('prev-btn').disabled = (currentStep === 0);
            
            if (currentStep === artworksData.length - 1) {
                document.getElementById('next-btn').innerText = "الختام ✨";
            } else {
                document.getElementById('next-btn').innerText = "اللوحة التالية →";
            }
        }

        function nextArtwork() {
            if (currentStep < artworksData.length - 1) {
                goToArtwork(currentStep + 1);
            } else {
                finishTour();
            }
        }

        function prevArtwork() {
            if (currentStep > 0) {
                goToArtwork(currentStep - 1);
            }
        }

        function finishTour() {
            stopSpeech();
            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 3.2, z: 14 }, 1400)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(guideCharacter.position)
                .to({ x: -3, y: 0, z: 3 }, 1200)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            const closing = "ختاماً، نشكركم على زيارة معرض اليوم الوطني الفني الباستيل. دمت يا وطننا شامخاً ونحلم ونحقق دائماً! 🇸🇦✨";
            document.getElementById('guide-text').innerText = closing;
            speakText(closing);

            document.getElementById('prev-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('action-btn').classList.remove('hidden');
            document.getElementById('action-btn').innerText = "إعادة الجولة 🔄";
            document.getElementById('action-btn').onclick = startTour;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                synth.speak(utterance);
            }
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                synth.cancel();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update();

            // Idle gentle bobbing effect for the Guide Character
            if (guideCharacter) {
                guideCharacter.rotation.y = Math.sin(time * 0.002) * 0.15;
            }

            renderer.render(scene, camera);
        }

        // Initialize and Start
        init3D();
        animate();
    </script>
</body>
</html>
