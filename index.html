<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض اليوم الوطني الفني 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        * { font-family: 'Tajawal', sans-serif; }
        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tween.js for Smooth Camera Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body class="text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 w-full h-screen flex flex-col justify-between p-4 md:p-6 pointer-events-none">
        
        <!-- Header -->
        <header class="flex justify-between items-center max-w-6xl mx-auto w-full glass-panel p-4 rounded-2xl pointer-events-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-lg shadow-lg">
                    🇸🇦
                </div>
                <div>
                    <h1 class="font-bold text-white text-base md:text-lg">معرض اليوم الوطني الفني</h1>
                    <p class="text-xs text-slate-400">إعداد الطالبة: لمى الغامدي | إشراف المعلمة: أمل</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs text-emerald-400 font-semibold hidden md:inline">جولة تفاعلية ثلاثية الأبعاد</span>
            </div>
        </header>

        <!-- Bottom Controls & Guide Dialogue Box -->
        <div class="max-w-2xl mx-auto w-full flex flex-col items-center gap-3 pointer-events-auto mb-2">
            
            <!-- Dialogue Box -->
            <div class="glass-panel p-4 rounded-2xl w-full text-center border-t-2 border-emerald-500 shadow-2xl">
                <div class="text-xs text-emerald-400 font-bold mb-1 flex items-center justify-center gap-1">
                    <span>👩‍🎓 مرشدة المعرض</span>
                </div>
                <p id="guide-text" class="text-sm md:text-base font-medium text-slate-200">
                    أهلاً بكِ في معرض اليوم الوطني الفني! اضغطي على زر "بدء الجولة" لنطوف معاً بين اللوحات.
                </p>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center gap-3 bg-slate-900/90 backdrop-blur-md p-2 rounded-2xl border border-slate-700 shadow-xl">
                <button id="prev-btn" onclick="prevArtwork()" class="hidden px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs md:text-sm font-bold transition disabled:opacity-40">
                    ← اللوحة السابقة
                </button>
                
                <button id="action-btn" onclick="startTour()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs md:text-sm font-extrabold shadow-lg transition">
                    بدء الجولة 🚀
                </button>

                <button id="next-btn" onclick="nextArtwork()" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs md:text-sm font-bold transition">
                    اللوحة التالية →
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Configuration
        const artworksData = [
            {
                title: "أصالة الماضي وحداثة الحاضر",
                artist: "الطالبة: سارة محمد",
                desc: "عمل فني تجسد فيه عراقة التراث السعودي ممزوجاً مع النهضة المعمارية الحديثة.",
                color: 0x0284c7,
                xPos: -8
            },
            {
                title: "طبيعة وشموخ وطن",
                artist: "الطالبة: ريم عبد الله",
                desc: "تجسيد رائع لطبيعة وتضاريس المملكة الخلابة بألوان أنيقة يعلوها شموخ النخيل.",
                color: 0x059669,
                xPos: 0
            },
            {
                title: "رؤية مستقبلية زاهية",
                artist: "الطالبة: شهد خالد",
                desc: "رسمة تجريدية تعبر عن طموحات اليوم الوطني ورؤية 2030 الزاهرة بسواعد الشباب.",
                color: 0xd97706,
                xPos: 8
            }
        ];

        let scene, camera, renderer;
        let currentStep = -1;
        let synth = window.speechSynthesis;

        function init3D() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 14);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            // Main Track Light
            const topLight = new THREE.DirectionalLight(0xffffff, 0.5);
            topLight.position.set(0, 10, 5);
            scene.add(topLight);

            // 5. Environment (Walls, Floor, Ceiling)
            createGalleryRoom();

            // 6. Add Artworks, Hanging Wires, Track Lights & Plants
            artworksData.forEach((art, index) => {
                createHangingArtwork(art, index);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function createGalleryRoom() {
            // Floor (Emerald Marble Look)
            const floorGeo = new THREE.PlaneGeometry(50, 30);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x064e3b, 
                roughness: 0.2, 
                metalness: 0.1 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            scene.add(floor);

            // Main Back Wall (Concrete Texture Finish)
            const wallGeo = new THREE.PlaneGeometry(50, 12);
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0x94a3b8, 
                roughness: 0.8 
            });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 6, -6);
            scene.add(wall);

            // Ceiling
            const ceilingGeo = new THREE.PlaneGeometry(50, 30);
            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
            const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 12;
            scene.add(ceiling);

            // Ceiling Track Light Bar (Horizontal Beam)
            const trackGeo = new THREE.BoxGeometry(40, 0.15, 0.3);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.position.set(0, 11.9, -5.2);
            scene.add(track);
        }

        function createHangingArtwork(art, index) {
            const group = new THREE.Group();
            group.position.x = art.xPos;

            // Artwork Panel Canvas
            const panelGeo = new THREE.BoxGeometry(3.6, 4.8, 0.1);
            const panelMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            panel.position.set(0, 5.2, -5.5);
            group.add(panel);

            // Inner Picture Plane
            const picGeo = new THREE.PlaneGeometry(3.2, 3.2);
            const picMat = new THREE.MeshStandardMaterial({ color: art.color, roughness: 0.5 });
            const pic = new THREE.Mesh(picGeo, picMat);
            pic.position.set(0, 5.6, -5.44);
            group.add(pic);

            // Wires Hanging from Ceiling
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x475569 });
            
            const wireGeoLeft = new THREE.CylinderGeometry(0.015, 0.015, 4.5);
            const wireLeft = new THREE.Mesh(wireGeoLeft, wireMat);
            wireLeft.position.set(-1.6, 9.7, -5.5);
            group.add(wireLeft);

            const wireRight = new THREE.Mesh(wireGeoLeft, wireMat);
            wireRight.position.set(1.6, 9.7, -5.5);
            group.add(wireRight);

            // Dedicated Spotlight above each artwork
            const spotLight = new THREE.SpotLight(0xfffbeb, 2.5);
            spotLight.position.set(art.xPos, 11.5, -4);
            spotLight.target = panel;
            spotLight.angle = Math.PI / 6;
            spotLight.penumbra = 0.4;
            scene.add(spotLight);

            // 🌿 Luxury Plant Decor (Potted Plants between and beside artworks)
            const plantGroup = createPlantPots();
            plantGroup.position.set(art.xPos + 4, 0, -5);
            scene.add(plantGroup);

            scene.add(group);
        }

        function createPlantPots() {
            const plantGroup = new THREE.Group();

            // Pot
            const potGeo = new THREE.CylinderGeometry(0.5, 0.35, 1.2, 16);
            const potMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.y = 0.6;
            plantGroup.add(pot);

            // Plant Leaves (Spherical Folia Cluster)
            const leafGeo = new THREE.SphereGeometry(0.75, 12, 12);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.8 });
            
            const leaf1 = new THREE.Mesh(leafGeo, leafMat);
            leaf1.position.set(0, 1.5, 0);
            plantGroup.add(leaf1);

            const leaf2 = new THREE.Mesh(leafGeo, leafMat);
            leaf2.position.set(0.2, 1.8, -0.1);
            leaf2.scale.set(0.8, 0.8, 0.8);
            plantGroup.add(leaf2);

            return plantGroup;
        }

        function startTour() {
            document.getElementById('action-btn').classList.add('hidden');
            document.getElementById('prev-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            goToArtwork(0);
        }

        function goToArtwork(index) {
            stopSpeech();
            currentStep = index;
            const item = artworksData[currentStep];

            // Animate Camera Smoothly using Tween.js
            new TWEEN.Tween(camera.position)
                .to({ x: item.xPos, y: 5.2, z: 2.2 }, 1400)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            document.getElementById('guide-text').innerHTML = `<b class="text-emerald-400">${item.title}</b> — ${item.artist}<br><span class="text-xs text-slate-300">${item.desc}</span>`;
            speakText(`${item.title}. ${item.artist}. ${item.desc}`);

            document.getElementById('prev-btn').disabled = (currentStep === 0);
            
            if (currentStep === artworksData.length - 1) {
                document.getElementById('next-btn').innerText = "الختام ✨";
            } else {
                document.getElementById('next-btn').innerText = "اللوحة التالية →";
            }
        }

        function nextArtwork() {
            if (currentStep < artworksData.length - 1) {
                goToArtwork(currentStep + 1);
            } else {
                finishTour();
            }
        }

        function prevArtwork() {
            if (currentStep > 0) {
                goToArtwork(currentStep - 1);
            }
        }

        function finishTour() {
            stopSpeech();
            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 3, z: 14 }, 1400)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            const closing = "ختاماً، نشكركم على زيارة معرض اليوم الوطني الفني. دمت يا وطننا شامخاً ونحلم ونحقق دائماً! 🇸🇦✨";
            document.getElementById('guide-text').innerText = closing;
            speakText(closing);

            document.getElementById('prev-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('action-btn').classList.remove('hidden');
            document.getElementById('action-btn').innerText = "إعادة الجولة 🔄";
            document.getElementById('action-btn').onclick = startTour;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                synth.speak(utterance);
            }
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                synth.cancel();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update();
            renderer.render(scene, camera);
        }

        // Initialize and Start
        init3D();
        animate();
    </script>
</body>
</html>
